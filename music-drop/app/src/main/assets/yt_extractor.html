<script>
// Bridge: called by Kotlin to extract a stream URL for a videoId
async function extractStream(videoId) {
    try {
        // Use the ytdl-core style info function bundled in p_web
        // p_web exports a handler via window.jsHandler or similar
        // We fetch the watch page and parse ytInitialPlayerResponse
        const resp = await fetch('https://www.youtube.com/watch?v=' + videoId + '&pbj=1', {
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'X-YouTube-Client-Name': '1',
                'X-YouTube-Client-Version': '2.20240101'
            }
        });
        const text = await resp.text();
        
        // Find ytInitialPlayerResponse in the page
        const match = text.match(/ytInitialPlayerResponse\s*=\s*(\{.+?\});/s) ||
                      text.match(/var ytInitialPlayerResponse = (\{.+?\});/s);
        if (!match) {
            YTStreamBridge.onError('Could not find player response');
            return;
        }
        
        const playerResp = JSON.parse(match[1]);
        const status = playerResp?.playabilityStatus?.status;
        if (status && status !== 'OK') {
            YTStreamBridge.onError('Not playable: ' + status);
            return;
        }
        
        const streamingData = playerResp?.streamingData;
        if (!streamingData) {
            YTStreamBridge.onError('No streaming data');
            return;
        }
        
        // Pick best audio stream from adaptiveFormats
        const formats = (streamingData.adaptiveFormats || [])
            .concat(streamingData.formats || []);
        
        const audioFormats = formats.filter(f => 
            f.mimeType && f.mimeType.startsWith('audio/') && f.url
        ).sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
        
        const best = audioFormats.find(f => f.mimeType.includes('mp4')) || audioFormats[0];
        
        if (!best || !best.url) {
            YTStreamBridge.onError('No playable audio stream found');
            return;
        }
        
        const title = playerResp?.videoDetails?.title || '';
        const author = playerResp?.videoDetails?.author || '';
        const duration = parseInt(playerResp?.videoDetails?.lengthSeconds || '0') * 1000;
        const thumb = playerResp?.videoDetails?.thumbnail?.thumbnails?.slice(-1)[0]?.url || '';
        
        YTStreamBridge.onStream(JSON.stringify({
            url: best.url,
            mimeType: best.mimeType,
            bitrate: best.bitrate || 0,
            title: title,
            author: author,
            durationMs: duration,
            thumbnailUrl: thumb
        }));
    } catch(e) {
        YTStreamBridge.onError(String(e));
    }
}
